
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodWise | Create Account</title>
    <link rel="stylesheet" href="./css/login.css">
    <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#9CAF88">
</head>
<body>

    <div class="login-container">

        <div class="login-left">
            <h1>FoodWise 🌿</h1>
            <h2>Start Your Food-Saving Journey!</h2>
            <p>Create your personal account and manage your food inventory smartly.</p>

            <div class="food-icons">🥑 🥕 🍅 🥬 🍋 🍓</div>

            <p class="tagline">Every little action saves food!</p>
        </div>

        <div class="login-right">
            <h2>Create Account</h2>
            <p>Join the FoodWise family!</p>

            <form id="registerForm">

                <label>Full Name</label>
                <input type="text" id="registerName"
                    placeholder="Enter your name" required>

                <label>Email Address</label>
                <input type="email" id="registerEmail"
                    placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" id="registerPassword"
                    placeholder="Create a password" minlength="6" required>

                <label>Confirm Password</label>
                <input type="password" id="confirmPassword"
                    placeholder="Confirm your password" minlength="6" required>

                <button type="submit">Create Account</button>

            </form>

            <p id="registerMessage"></p>

            <p class="register-text">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </div>

    </div>

    <script type="module" src="./js/auth.js"></script>
<script src="./js/pwa.js"></script>
</body>
</html>
